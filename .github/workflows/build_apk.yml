name: Zbuduj APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Zabezpieczenie kodu main.dart
        run: |
          mkdir -p /tmp/save_code
          cp lib/main.dart /tmp/save_code/main.dart

      - name: Konfiguracja Javy
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generowanie struktury Androida
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --project-name skaner_dc06 . --platforms=android
          flutter pub add google_mlkit_text_recognition google_mlkit_barcode_scanning image_picker
          cp -r android ../
          cp pubspec.yaml ../
          cd ..
          rm -rf temp_app
          cp /tmp/save_code/main.dart lib/main.dart

      - name: Ustawienie minimalnego SDK Androida na 21
        run: |
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle* || true

      - name: Pobranie zaleznosci
        run: flutter pub get

      - name: Budowanie pliku APK
        run: flutter build apk --debug

      - name: Zapisz gotowy plik APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-debug.apk
